<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Revision Post: Grade 7 E.L.A. revision game (3rd trimester).">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>The Revision Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Layout: a sorting-office desk — stamp album on the home screen, one letter (question card) at a time in play */
:root {
  --paper: #eaf0f7;
  --card: #ffffff;
  --ink: #1d2a4d;
  --muted: #5b6683;
  --line: #d3dce9;
  --red: #d6423a;
  --blue: #2f5fb3;
  --good: #1d8656;
  --good-bg: #e3f5ec;
  --bad: #c2410c;
  --bad-bg: #fdece4;
  --chip: #f3f6fb;
  --s1: #4f8a3c; --s2: #7a4fc4; --s3: #d08a12; --s4: #c2414f; --s5: #2f6fb3; --s6: #a5458f; --s7: #1f8a85; --s8: #1d2a4d;
  --display: "Rubik Dirt", "Fredoka", system-ui, sans-serif;
  --head: "Fredoka", "Quicksand", system-ui, sans-serif;
  --body: "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1626; --card: #18223a; --ink: #e8eefb; --muted: #9aa7c3; --line: #2b3858;
  --red: #ef6b5f; --blue: #7ea6f2; --good: #4cc38a; --good-bg: #12352a; --bad: #f2925f; --bad-bg: #3a2016; --chip: #202c48;
  --s1: #79b866; --s2: #a782ec; --s3: #e8a93a; --s4: #e8697a; --s5: #6c9fe0; --s6: #d077bd; --s7: #4fbdb6; --s8: #9fb3dd;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0f1626; --card: #18223a; --ink: #e8eefb; --muted: #9aa7c3; --line: #2b3858;
  --red: #ef6b5f; --blue: #7ea6f2; --good: #4cc38a; --good-bg: #12352a; --bad: #f2925f; --bad-bg: #3a2016; --chip: #202c48;
  --s1: #79b866; --s2: #a782ec; --s3: #e8a93a; --s4: #e8697a; --s5: #6c9fe0; --s6: #d077bd; --s7: #4fbdb6; --s8: #9fb3dd;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-weight: 500; font-size: 16px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.airmail { height: 10px; border-radius: 6px; background: repeating-linear-gradient(-45deg, var(--red) 0 14px, var(--card) 14px 24px, var(--blue) 24px 38px, var(--card) 38px 48px); }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 16px 0 8px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 7vw, 56px); line-height: 1; margin: 0; color: var(--blue); letter-spacing: .5px; text-wrap: balance; }
.sub { color: var(--muted); font-weight: 600; margin: 6px 0 0; }
.total { font-family: var(--head); font-weight: 600; background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 8px 14px; text-align: right; font-variant-numeric: tabular-nums; }
.total b { font-size: 22px; color: var(--red); }
.name-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 14px 0 18px; }
.name-row label { font-family: var(--head); font-weight: 600; }
.name-row input { flex: 1; min-width: 0; font: inherit; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); }
.name-row input:focus { outline: 3px solid var(--blue); outline-offset: 1px; }
.name-row small { color: var(--muted); width: 100%; }

.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
.stamp { --c: var(--s1); position: relative; border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--ink); background: var(--card); padding: 9px; border-radius: 4px;
  -webkit-mask: linear-gradient(#000 0 0) content-box, radial-gradient(circle 5px at 5px 5px, transparent 98%, #000) -5px -5px / 14px 14px;
  mask: linear-gradient(#000 0 0) content-box, radial-gradient(circle 5px at 5px 5px, transparent 98%, #000) -5px -5px / 14px 14px;
  filter: drop-shadow(0 2px 0 var(--line)); transition: transform .15s ease; display: flex; }
.stamp .inner { flex: 1; }
.stamp:hover { transform: rotate(-1.5deg) translateY(-2px); }
.stamp:focus-visible { outline: none; transform: rotate(-1.5deg) translateY(-2px); }
.stamp:focus-visible .inner { outline: 3px solid var(--blue); outline-offset: 2px; }
.stamp .inner { border: 2px solid var(--c); border-radius: 3px; padding: 12px 12px 10px; min-height: 172px; display: flex; flex-direction: column; gap: 6px; }
.stamp .glyph { font-family: var(--display); font-size: 40px; line-height: 1; color: var(--c); }
.stamp .t { font-family: var(--head); font-weight: 600; font-size: 17px; line-height: 1.2; }
.stamp .d { font-size: 13px; color: var(--muted); flex: 1; }
.stamp .foot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.stars { letter-spacing: 2px; color: var(--line); font-size: 16px; }
.stars .on { color: #f0b429; }
.postmark { position: absolute; right: 10px; top: 10px; width: 70px; height: 70px; border-radius: 50%; border: 3px double var(--red); color: var(--red); display: grid; place-items: center; text-align: center;
  font-family: var(--head); font-weight: 700; font-size: 10px; line-height: 1.1; transform: rotate(14deg); opacity: .85; pointer-events: none; }
.stamp.final { --c: var(--s8); grid-column: 1 / -1; }
.stamp.final .inner { min-height: 0; flex-direction: row; align-items: center; gap: 16px; flex-wrap: wrap; }
.stamp.final .glyph { font-size: 46px; color: var(--red); }
.stamp.final .mid { flex: 1; min-width: 180px; }

/* play */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 14px 0; }
.btn { font-family: var(--head); font-weight: 600; font-size: 16px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); padding: 9px 16px; cursor: pointer; }
.btn:hover { background: var(--chip); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--card); }
.btn.primary:hover { filter: brightness(1.08); background: var(--blue); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.pill.streak { color: var(--red); }
.progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.progress span { display: block; height: 100%; background: var(--c, var(--blue)); width: 0; transition: width .3s ease; }

.letter { --c: var(--blue); background: var(--card); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; }
.letter .airmail { border-radius: 0; height: 8px; }
.letter .body { padding: 20px clamp(16px, 4vw, 30px) 24px; }
.letter .kicker { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: var(--c); margin: 0 0 6px; }
.letter .q { font-family: var(--head); font-weight: 600; font-size: clamp(19px, 3.6vw, 24px); line-height: 1.35; margin: 0 0 18px; text-wrap: balance; }
.gap { display: inline-block; min-width: 70px; border-bottom: 3px solid var(--c); margin: 0 3px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; font: inherit; font-weight: 600; font-size: 17px; color: var(--ink); background: var(--chip); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); font-family: var(--head); font-size: 14px; color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--c); }
.opt:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt:disabled { cursor: default; }

.build { min-height: 58px; border: 2px dashed var(--c); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.build.empty::before { content: "Tap the pieces in the right order…"; color: var(--muted); font-size: 14px; padding: 4px 6px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tile { font: inherit; font-weight: 700; font-size: 16px; border-radius: 10px; padding: 7px 12px; border: 2px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
.tile:hover:not(:disabled) { border-color: var(--c); }
.tile:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.tile.used { visibility: hidden; }
.build .tile { background: var(--card); border-color: var(--c); }
.build.ok .tile { border-color: var(--good); background: var(--good-bg); }
.build.no .tile { border-color: var(--bad); background: var(--bad-bg); }
.order-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.feedback { margin-top: 16px; border-radius: 12px; padding: 12px 14px; font-size: 15px; display: grid; gap: 4px; }
.feedback.ok { background: var(--good-bg); border-left: 5px solid var(--good); }
.feedback.no { background: var(--bad-bg); border-left: 5px solid var(--bad); }
.feedback strong { font-family: var(--head); font-size: 17px; }
.feedback.ok strong { color: var(--good); }
.feedback.no strong { color: var(--bad); }
.next-row { display: flex; justify-content: flex-end; margin-top: 14px; }

/* result postcard */
.postcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.postcard .pc { display: grid; grid-template-columns: 1.2fr 1fr; }
.postcard .left { padding: 22px; border-right: 2px dashed var(--line); min-width: 0; }
.postcard .right { padding: 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; min-width: 0; }
.postcard h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; margin: 0 0 8px; color: var(--red); }
.big { font-family: var(--head); font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 18px; color: var(--muted); }
.addr { width: 100%; border-bottom: 1.5px solid var(--line); padding: 4px 0; font-weight: 700; }
.addr span { color: var(--muted); font-weight: 600; font-size: 13px; margin-right: 6px; }
.review { margin-top: 16px; display: grid; gap: 8px; }
.review .item { background: var(--bad-bg); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.review .item b { display: block; }
.stars.big-stars { font-size: 34px; letter-spacing: 4px; }
.how { margin-top: 22px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
.how b { color: var(--ink); }

@media (max-width: 600px) {
  .postcard .pc { grid-template-columns: 1fr; }
  .postcard .left { border-right: 0; border-bottom: 2px dashed var(--line); }
  .postmark { width: 58px; height: 58px; font-size: 9px; }
}
@keyframes pop { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.pop { animation: pop .25s ease; }
.shake { animation: shake .25s ease; }
@media (prefers-reduced-motion: reduce) { .pop, .shake { animation: none; } .stamp, .progress span { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const TOPICS = [
  { id: "cond", glyph: "If…", title: "Conditionals, I wish & could", desc: "1st & 2nd conditional, if in the middle, I wish, could", c: "--s1" },
  { id: "verb", glyph: "-ing", title: "Verb Patterns", desc: "to + infinitive, -ing, object + to, remember / stop / try", c: "--s2" },
  { id: "poss", glyph: "'s", title: "Possessives & Pronouns", desc: "'s or s', 's or of, myself, each other, my own", c: "--s3" },
  { id: "link", glyph: "as", title: "Linking Words", desc: "in case, unless, as long as, as, like, as if", c: "--s4" },
  { id: "letter", glyph: "Dear", title: "Formal Letter", desc: "Layout, greetings, closings, formal language", c: "--s5" },
  { id: "au", glyph: "A.U.", title: "Address Unknown", desc: "Characters, plot, themes, the ending", c: "--s6" },
  { id: "ww", glyph: "Pen", title: "Women Writers", desc: "Pen names, Behn, Austen, Woolf", c: "--s7" },
];

// q: prompt (use ___ for the gap), o: options (first is correct), e: explanation
// type "order": w = correct words in order
const BANK = {
  cond: [
    { q: "If it ___ tomorrow, we won't go to the park.", o: ["rains", "will rain", "rained"], e: "1st conditional: if + present simple, will / won't + verb." },
    { q: "I ___ you the answer if I knew it.", o: ["would tell", "will tell", "told"], e: "2nd conditional: would + verb … if + past simple." },
    { q: "If I ___ you, I would study tonight.", o: ["were", "am", "will be"], e: "We say If I were you to give advice (2nd conditional)." },
    { q: "We'll miss the bus if we ___ hurry.", o: ["don't", "won't", "didn't"], e: "No will after if. Use the present simple: if we don't hurry." },
    { q: "She ___ so tired if she didn't go to bed so late.", o: ["wouldn't be", "won't be", "isn't"], e: "2nd conditional: wouldn't + verb … if + past simple." },
    { q: "I wish I ___ a bigger bedroom.", o: ["had", "have", "will have"], e: "I wish + past simple: a wish about now (I don't have one)." },
    { q: "I wish it ___ so cold today.", o: ["weren't", "isn't", "won't be"], e: "I wish + past simple. You can say weren't or wasn't." },
    { q: "If she could speak Japanese, she ___ work in Tokyo.", o: ["could", "can", "will"], e: "could = would be able to." },
    { q: "Which sentence is correct?", o: ["I'll call you if I need help.", "I'll call you if I will need help.", "I'd call you if I need help."], e: "No will after if, and will goes with the present simple." },
    { q: "Which sentence is about an imaginary situation?", o: ["If I had wings, I would fly to school.", "If it rains, I'll stay at home.", "If you study, you'll pass."], e: "The 2nd conditional (if + past, would) is for unreal or imaginary situations." },
    { q: "Which sentence has the comma in the right place?", o: ["If it rains, I'll stay at home.", "I'll stay at home, if it rains.", "If it rains I'll, stay at home."], e: "Use a comma when if comes first. No comma when if is in the middle." },
    { q: "What would you do if you ___ a million dollars?", o: ["won", "win", "will win"], e: "2nd conditional: if + past simple." },
    { q: "I wish I ___ swim. I'm scared of the water.", o: ["could", "can", "will"], e: "I wish I could = I wish I was able to." },
    { type: "order", q: "Put if in the middle: “If I had more money, I would buy a bike.”", w: ["I", "would", "buy", "a", "bike", "if", "I", "had", "more", "money."], e: "Start with the would part. No comma when if is in the middle." },
    { type: "order", q: "Put if in the middle: “If you don't study, you won't pass.”", w: ["You", "won't", "pass", "if", "you", "don't", "study."], e: "Start with the will / won't part. No comma when if is in the middle." },
    { type: "order", q: "Put if in the middle: “If she didn't live so far, we would visit her.”", w: ["We", "would", "visit", "her", "if", "she", "didn't", "live", "so", "far."], e: "would + verb … if + past simple." },
  ],
  verb: [
    { q: "I enjoy ___ comics.", o: ["reading", "to read", "read"], e: "enjoy + -ing." },
    { q: "She decided ___ to the party.", o: ["not to go", "not going", "to not go"], e: "decide + (not) to + verb. The not goes before to." },
    { q: "They promised ___ late again.", o: ["not to be", "not being", "to not be"], e: "promise + (not) to + verb." },
    { q: "My parents don't allow me ___ out late.", o: ["to stay", "staying", "stay"], e: "allow + object + to + verb." },
    { q: "He avoided ___ at the teacher.", o: ["looking", "to look", "look"], e: "avoid + -ing." },
    { q: "Can you remind me ___ the milk?", o: ["to buy", "buying", "buy"], e: "remind + object + to + verb." },
    { q: "I'll never forget ___ the sea for the first time.", o: ["seeing", "to see", "see"], e: "forget + -ing = a memory of the past." },
    { q: "My dad stopped ___ sugar last year. Now he feels great.", o: ["eating", "to eat", "eat"], e: "stop + -ing = quit the habit." },
    { q: "On the way home, we stopped ___ a photo of the sunset.", o: ["to take", "taking", "take"], e: "stop + to = stop one action in order to do another." },
    { q: "The coach told us ___ up.", o: ["not to give", "not giving", "to not give"], e: "tell + object + not to + verb." },
    { q: "I can't help ___ when he tells jokes.", o: ["laughing", "to laugh", "laugh"], e: "can't help + -ing." },
    { q: "Which verb is followed by -ing?", o: ["finish", "decide", "promise"], e: "finish + -ing. decide and promise take to + verb." },
    { q: "Which verb is followed by object + to + verb?", o: ["persuade", "enjoy", "avoid"], e: "persuade someone to do something." },
    { q: "Which pair has the SAME meaning?", o: ["started raining / started to rain", "stopped smoking / stopped to smoke", "remember locking / remember to lock"], e: "start, begin, continue, like, love, hate: both forms mean the same." },
    { q: "Don't forget ___ the cat while I'm away!", o: ["to feed", "feeding", "feed"], e: "forget + to = a duty you need to do." },
    { type: "order", q: "Build the sentence: Mum said, “Don't tell anyone.”", w: ["Mum", "asked", "me", "not", "to", "tell", "anyone."], e: "ask + object + not to + verb." },
  ],
  poss: [
    { q: "This is my ___ room. (one sister)", o: ["sister's", "sisters'", "sisters"], e: "One person: 's." },
    { q: "The ___ changing room is on the left. (many boys)", o: ["boys'", "boy's", "boys's"], e: "Plural ending in -s: just add '." },
    { q: "The ___ books are new.", o: ["children's", "childrens'", "childrens"], e: "Plural without -s (children, people, men): add 's." },
    { q: "Which is correct?", o: ["the end of the film", "the film's end of", "the end the film's"], e: "Use of for things and ideas." },
    { q: "___ meeting has been cancelled.", o: ["Tomorrow's", "Tomorrow", "The meeting of tomorrow's"], e: "Use 's with time words: tomorrow's, today's, next week's." },
    { q: "Which is more natural?", o: ["Tom's computer", "the computer of Tom"], e: "Use 's for people." },
    { q: "It's only ___ walk from here.", o: ["ten minutes'", "ten minute's", "ten minutes's"], e: "Time + plural: ten minutes' walk, two hours' drive." },
    { q: "Tom hurt ___ while playing football.", o: ["himself", "herself", "itself"], e: "Subject and object are the same person: Tom → himself." },
    { q: "We really enjoyed ___ at the beach.", o: ["ourselves", "ourself", "yourselves"], e: "we → ourselves." },
    { q: "Mia helped Leo and Leo helped Mia. They helped ___.", o: ["each other", "themselves", "theirselves"], e: "each other = A → B and B → A." },
    { q: "I feel nervous. I can't ___.", o: ["relax", "relax myself", "relax me"], e: "We say relax, not relax myself." },
    { q: "Bruno is a friend of ___.", o: ["mine", "me", "my"], e: "a friend of mine / yours / his / hers / ours / theirs." },
    { q: "I'd love to have my ___ bedroom.", o: ["own", "own's", "self"], e: "my own + noun = only mine, not shared. Never an own." },
    { q: "She likes living ___. She has no roommates.", o: ["on her own", "on herself", "by her own"], e: "on my own = by myself = alone." },
    { q: "The cat licked ___ clean.", o: ["itself", "himself", "it's self"], e: "it → itself." },
  ],
  link: [
    { q: "Take a jacket ___ it gets cold.", o: ["in case", "unless", "as if"], e: "in case = because it's possible (do it now, just in case)." },
    { q: "___ fire, use the stairs.", o: ["In case of", "In case", "Unless"], e: "in case of + noun = if there is." },
    { q: "You can't go in ___ you have a ticket.", o: ["unless", "as long as", "in case"], e: "unless = except if." },
    { q: "You can borrow my bike ___ you bring it back.", o: ["as long as", "unless", "in case"], e: "as long as = only if / on condition that." },
    { q: "We'll have a picnic ___ it's sunny.", o: ["provided", "unless", "as if"], e: "provided (that) = only if." },
    { q: "I'll buy extra pizza ___ Tom comes. (Buy it now, he might come.)", o: ["in case", "if"], e: "in case: you act now, before you know." },
    { q: "“As I was walking home, I saw Leo.” Here as means…", o: ["at the same time as", "because", "like"], e: "Two things happen together = at the same time as." },
    { q: "“As it was late, we took a taxi.” Here as means…", o: ["because", "at the same time as", "like"], e: "as = because (a reason)." },
    { q: "Which sentence is correct?", o: ["When I was a child, I lived in Recife.", "As I was a child, I lived in Recife."], e: "Use when for a period of life, not as." },
    { q: "Your sister looks ___ you!", o: ["like", "as"], e: "like + noun / pronoun = similar to." },
    { q: "She works ___ a nurse at the hospital.", o: ["as", "like"], e: "as + job = it IS her job." },
    { q: "___ usual, Pedro was late.", o: ["As", "Like"], e: "We say as usual and as always." },
    { q: "My phone is the same ___ yours.", o: ["as", "like"], e: "the same as (never the same like)." },
    { q: "You look ___ you've seen a ghost!", o: ["as if", "as", "unless"], e: "look as if / like + subject + verb." },
    { q: "Take an umbrella in case it ___.", o: ["rains", "will rain", "rained"], e: "No will after in case, unless, as long as, provided." },
    { q: "He talks as if he ___ everything. (He doesn't!)", o: ["knew", "know", "knowing"], e: "Not real? Use the past after as if." },
  ],
  letter: [
    { q: "Where do you write your own address?", o: ["In the top right corner", "At the bottom, after your name", "After the greeting"], e: "Your address and the date go at the top (right, or left if easier)." },
    { q: "You don't know the person's name. Which greeting?", o: ["Dear Sir/Madam,", "Hi there!", "Hey you,"], e: "Dear Sir/Madam is polite and formal." },
    { q: "Which greeting is correct for a formal letter?", o: ["Dear Ms. Costa,", "Hello Helena!", "Hi Ms. Costa!!"], e: "Dear + title + surname." },
    { q: "Which is a good formal closing?", o: ["Yours sincerely,", "See ya!", "Love,"], e: "Yours sincerely, or Best regards," },
    { q: "Which sentence is formal?", o: ["I would be grateful if you could send me more information.", "Send me more info, OK?", "Gimme the info pls."], e: "Use polite, complete sentences." },
    { q: "Which is better in a formal letter?", o: ["I am writing to ask about the course.", "I'm writin' to ask bout the course."], e: "No slang or contractions in a formal letter." },
    { q: "I look forward to ___ from you.", o: ["hearing", "hear", "heard"], e: "look forward to + -ing (a verb pattern!)." },
    { q: "Where does your signature go?", o: ["Above your typed full name, after the closing", "Before the greeting", "Next to the date"], e: "Closing, then handwritten signature, then full name." },
    { q: "What should the body of the letter do?", o: ["Explain the reason for writing, in short paragraphs", "Tell jokes to make it friendly", "Repeat the greeting"], e: "Be clear, focused and organised." },
    { type: "order", q: "Put the parts of a formal letter in order.", w: ["Your address & date", "Recipient's address", "Greeting", "Body", "Closing", "Signature & name"], e: "Address & date → recipient → greeting → body → closing → signature." },
  ],
  au: [
    { q: "Who wrote Address Unknown?", o: ["Kathrine Kressmann Taylor", "Jane Austen", "Virginia Woolf"], e: "Kathrine Kressmann Taylor." },
    { q: "What kind of story is it?", o: ["An epistolary novella (told through letters)", "A play", "A book of poems"], e: "Epistolary = told through letters." },
    { q: "Who is Max Eisenstein?", o: ["A Jewish American with an art gallery in the U.S.", "A German Nazi officer", "Griselle's husband"], e: "Max is Jewish, lives in San Francisco and owns an art gallery." },
    { q: "Where does Martin Schulse move with his family?", o: ["Back to Germany", "To New York", "To England"], e: "Martin returns to Germany in 1932." },
    { q: "How does Martin change?", o: ["He becomes a Nazi supporter and antisemitic", "He moves to America to help Max", "He becomes an actor"], e: "His letters grow cold and antisemitic." },
    { q: "Who is Griselle?", o: ["Max's sister, an actress", "Martin's wife", "Max's daughter"], e: "Griselle is Max's sister, an actress, and was once Martin's lover." },
    { q: "Why does Martin refuse to help Griselle?", o: ["He is afraid for his own and his family's safety", "He doesn't know who she is", "She never asks him"], e: "He chooses his safety and position over her life." },
    { q: "How does Max take revenge?", o: ["He sends letters that look like secret codes", "He travels to Germany to fight Martin", "He writes to the newspapers"], e: "The Nazis read the letters and suspect Martin." },
    { q: "The last letter comes back marked “Address Unknown”. What does it suggest?", o: ["Martin has probably been arrested or killed", "Martin moved to a bigger house", "The post office lost the letter"], e: "Martin's fate is unknown, but probably terrible." },
    { q: "When does the story take place?", o: ["1932–1934, before World War II", "1914–1918, during World War I", "In the 1990s"], e: "1932–1934, as the Nazis rise to power." },
    { q: "What is propaganda?", o: ["Information used to influence what people think, often biased or misleading", "A kind of business letter", "A type of friendship"], e: "The Nazis used propaganda to spread hate." },
    { q: "What is antisemitism?", o: ["Hatred of or prejudice against Jewish people", "Love of art", "Fear of writing letters"], e: "It is one of the main themes of the book." },
    { q: "What is the main idea of the story?", o: ["A friendship destroyed by hatred, prejudice and Nazism", "A love story in Paris", "An adventure at sea"], e: "Hate, fear and prejudice turn friends into enemies." },
  ],
  ww: [
    { q: "What is a pen name (pseudonym)?", o: ["A fictitious name used by an author", "A special pen for writing", "The title of a book"], e: "Also called a nom de plume." },
    { q: "Charlotte Brontë published as…", o: ["Currer Bell", "Ellis Bell", "Acton Bell"], e: "Charlotte = Currer, Emily = Ellis, Anne = Acton." },
    { q: "Emily Brontë published as…", o: ["Ellis Bell", "Currer Bell", "George Sand"], e: "Emily = Ellis Bell." },
    { q: "Anne Brontë published as…", o: ["Acton Bell", "Ellis Bell", "George Eliot"], e: "Anne = Acton Bell." },
    { q: "George Eliot's real name was…", o: ["Mary Ann Evans", "Aurore Dupin", "Aphra Behn"], e: "Mary Ann Evans wrote as George Eliot." },
    { q: "George Sand's real name was…", o: ["Aurore Dupin", "Mary Ann Evans", "Jane Austen"], e: "Aurore Dupin wrote as George Sand." },
    { q: "Why did some women use pen names?", o: ["To be published and taken seriously", "Because their names were too long", "Because they were already famous"], e: "Also to hide their identity and escape social limits." },
    { q: "Who is considered the first professional female writer?", o: ["Aphra Behn", "Virginia Woolf", "Emily Brontë"], e: "Aphra Behn wrote to earn money." },
    { q: "The Feign'd Curtizans is…", o: ["a play by Aphra Behn", "a novel by Jane Austen", "an essay by Virginia Woolf"], e: "Aphra Behn was known for her plays." },
    { q: "Jane Austen's key work is…", o: ["Pride and Prejudice", "A Room of One's Own", "Address Unknown"], e: "Austen explored society, marriage and character." },
    { q: "In A Room of One's Own, Woolf says a woman needs…", o: ["money and a room of her own to write fiction", "a pen name to be published", "a famous husband"], e: "Without money and space, women could not write." },
    { q: "Virginia Woolf was a leading ___ writer.", o: ["modernist", "medieval", "Victorian"], e: "Woolf was a leading modernist writer." },
  ],
};

const ROUND = 8, FINAL = 15;
const KEY = "revision-post-v1";
let save = { name: "", best: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

const app = document.getElementById("app");
let game = null;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function starsFor(pct) { return pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0; }
function starHTML(n, cls = "") { return `<span class="stars ${cls}" aria-label="${n} of 3 stars">${[0,1,2].map(i => `<span class="${i < n ? "on" : ""}">★</span>`).join("")}</span>`; }
function topicById(id) { return id === "final" ? { id: "final", title: "Final Delivery", c: "--s8", glyph: "✉" } : TOPICS.find(t => t.id === id); }
function gapify(q) { return esc(q).replace("___", '<span class="gap" aria-label="blank"></span>'); }

function home() {
  game = null;
  const collected = TOPICS.filter(t => (save.best[t.id]?.stars || 0) >= 2).length;
  const totalStars = Object.values(save.best).reduce((a, b) => a + (b.stars || 0), 0);
  app.innerHTML = `
    <div class="airmail"></div>
    <header class="top">
      <div>
        <h1>The Revision Post</h1>
        <p class="sub">Grade 7 · E.L.A. · 3rd trimester revision game</p>
      </div>
      <div class="total" aria-live="polite">Stamps <b>${collected}</b>/${TOPICS.length}<br>Stars <b>${totalStars}</b>/${(TOPICS.length + 1) * 3}</div>
    </header>
    <div class="name-row">
      <label for="who">From:</label>
      <input id="who" type="text" maxlength="30" placeholder="Write your name" value="${esc(save.name)}" autocomplete="off">
      <small>Each topic is a stamp. Answer 8 questions. Get 2 or 3 stars to postmark the stamp, then try the Final Delivery.</small>
    </div>
    <div class="album">
      ${TOPICS.map(t => {
        const b = save.best[t.id];
        const done = (b?.stars || 0) >= 2;
        return `<button class="stamp" data-go="${t.id}" style="--c: var(${t.c})">
          <div class="inner">
            <span class="glyph" aria-hidden="true">${esc(t.glyph)}</span>
            <span class="t">${esc(t.title)}</span>
            <span class="d">${esc(t.desc)}</span>
            <span class="foot">${starHTML(b?.stars || 0)}<span>${b ? "Best " + b.pct + "%" : "Not played"}</span></span>
          </div>
          ${done ? `<span class="postmark" aria-label="Collected">DELIVERED<br>${esc(b.date || "")}</span>` : ""}
        </button>`;
      }).join("")}
      <button class="stamp final" data-go="final">
        <div class="inner">
          <span class="glyph" aria-hidden="true">✉</span>
          <span class="mid"><span class="t" style="display:block">Final Delivery</span><span class="d">15 mixed questions from every topic. The big test before the test!</span></span>
          <span class="foot" style="gap:12px">${starHTML(save.best.final?.stars || 0)}<span>${save.best.final ? "Best " + save.best.final.pct + "%" : "Not played"}</span></span>
        </div>
      </button>
    </div>
    <div class="how">
      <div><b>Scoring:</b> 10 points for each right answer. Get 3 in a row for a streak bonus of +5.</div>
      <div><b>Stars:</b> 50% = 1 star · 70% = 2 stars · 90% = 3 stars.</div>
    </div>`;
  const who = document.getElementById("who");
  who.addEventListener("input", () => { save.name = who.value.trim(); persist(); });
  app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => start(b.dataset.go)));
}

function start(id) {
  let qs;
  if (id === "final") {
    const per = TOPICS.map(t => shuffle(BANK[t.id]));
    qs = []; let i = 0;
    while (qs.length < FINAL) { const pool = per[i % per.length]; if (pool.length) qs.push(Object.assign({ from: TOPICS[i % per.length].title }, pool.pop())); i++; }
    qs = shuffle(qs);
  } else qs = shuffle(BANK[id]).slice(0, ROUND);
  game = { id, qs, i: 0, score: 0, right: 0, streak: 0, misses: [], answered: false };
  render();
}

function render() {
  const t = topicById(game.id);
  const q = game.qs[game.i];
  const n = game.qs.length;
  app.innerHTML = `
    <div class="bar">
      <button class="btn" id="back">← Album</button>
      <div class="meta">
        <span class="pill">Letter ${game.i + 1} of ${n}</span>
        <span class="pill">${game.score} pts</span>
        <span class="pill streak">${game.streak >= 2 ? "Streak " + game.streak : "Streak –"}</span>
      </div>
    </div>
    <div class="progress" style="--c: var(${t.c})"><span style="width:${(game.i / n) * 100}%"></span></div>
    <article class="letter" style="--c: var(${t.c})" id="card">
      <div class="airmail"></div>
      <div class="body">
        <p class="kicker">${esc(q.from || t.title)}</p>
        <p class="q">${gapify(q.q)}</p>
        <div id="area"></div>
        <div id="fb"></div>
      </div>
    </article>`;
  document.getElementById("back").addEventListener("click", home);
  (q.type === "order" ? renderOrder : renderMC)(q);
}

function renderMC(q) {
  const area = document.getElementById("area");
  const opts = shuffle(q.o.map((text, idx) => ({ text, ok: idx === 0 })));
  area.innerHTML = `<div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o.text)}</span></button>`).join("")}</div>`;
  const btns = [...area.querySelectorAll(".opt")];
  btns.forEach(b => b.addEventListener("click", () => {
    if (game.answered) return;
    const o = opts[+b.dataset.i];
    btns.forEach((x, i) => { x.disabled = true; if (opts[i].ok) x.classList.add("right"); });
    if (!o.ok) b.classList.add("wrong");
    answer(o.ok, q, q.o[0]);
  }));
  btns[0].focus({ preventScroll: true });
}

function renderOrder(q) {
  const area = document.getElementById("area");
  const tiles = shuffle(q.w.map((w, idx) => ({ w, idx })));
  const picked = [];
  area.innerHTML = `<div class="build empty" id="build" aria-live="polite"></div><div class="bank" id="bank"></div>
    <div class="order-actions"><button class="btn" id="clear">Clear</button><button class="btn primary" id="check" disabled>Check</button></div>`;
  const build = document.getElementById("build"), bank = document.getElementById("bank"), check = document.getElementById("check");
  function draw() {
    bank.innerHTML = tiles.map((t, i) => `<button class="tile ${picked.includes(i) ? "used" : ""}" data-i="${i}" ${picked.includes(i) ? 'tabindex="-1" aria-hidden="true"' : ""}>${esc(t.w)}</button>`).join("");
    build.innerHTML = picked.map((pi, k) => `<button class="tile" data-k="${k}">${esc(tiles[pi].w)}</button>`).join("");
    build.classList.toggle("empty", picked.length === 0);
    check.disabled = picked.length !== tiles.length || game.answered;
    if (game.answered) { bank.querySelectorAll("button").forEach(b => b.disabled = true); build.querySelectorAll("button").forEach(b => b.disabled = true); }
    bank.querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => { if (game.answered) return; picked.push(+b.dataset.i); draw(); }));
    build.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => { if (game.answered) return; picked.splice(+b.dataset.k, 1); draw(); }));
  }
  draw();
  document.getElementById("clear").addEventListener("click", () => { if (game.answered) return; picked.length = 0; draw(); });
  check.addEventListener("click", () => {
    if (game.answered) return;
    const said = picked.map(pi => tiles[pi].w).join(" ");
    const ok = said === q.w.join(" ");
    build.classList.add(ok ? "ok" : "no");
    document.getElementById("clear").disabled = true;
    answer(ok, q, q.w.join(q.w.some(w => w.includes(" ")) ? " → " : " "));
    draw();
  });
}

function answer(ok, q, correct) {
  game.answered = true;
  const card = document.getElementById("card");
  if (ok) {
    game.right++; game.streak++;
    const bonus = game.streak >= 3 ? 5 : 0;
    game.score += 10 + bonus;
    card.classList.add("pop");
    fb(`<strong>Delivered!${bonus ? " +15 (streak bonus)" : " +10"}</strong><span>${esc(q.e)}</span>`, "ok");
  } else {
    game.streak = 0;
    game.misses.push({ q: q.q, a: correct, e: q.e });
    card.classList.add("shake");
    fb(`<strong>Return to sender</strong><span>Correct answer: <b>${esc(correct)}</b></span><span>${esc(q.e)}</span>`, "no");
  }
  const meta = document.querySelectorAll(".meta .pill");
  meta[1].textContent = game.score + " pts";
  meta[2].textContent = game.streak >= 2 ? "Streak " + game.streak : "Streak –";
}

function fb(html, cls) {
  const last = game.i === game.qs.length - 1;
  document.getElementById("fb").innerHTML = `<div class="feedback ${cls}" role="status">${html}</div>
    <div class="next-row"><button class="btn primary" id="next">${last ? "See my postcard →" : "Next letter →"}</button></div>`;
  const nx = document.getElementById("next");
  nx.addEventListener("click", () => { if (last) result(); else { game.i++; game.answered = false; render(); } });
  nx.focus({ preventScroll: true });
}

function result() {
  const t = topicById(game.id);
  const n = game.qs.length;
  const pct = Math.round((game.right / n) * 100);
  const stars = starsFor(pct);
  const prev = save.best[game.id];
  const d = new Date();
  const date = d.toLocaleDateString(undefined, { day: "2-digit", month: "short" });
  let newBest = false;
  if (!prev || pct > prev.pct) { save.best[game.id] = { pct, stars, score: game.score, date }; persist(); newBest = true; }
  const msg = stars === 3 ? "First class!" : stars === 2 ? "Stamp collected!" : stars === 1 ? "Almost there!" : "Try again!";
  const tip = stars >= 2 ? (game.id === "final" ? "You're ready for the test." : "Your stamp is postmarked in the album.") : "Get 70% or more to postmark this stamp. Read the study guide page and try again.";
  app.innerHTML = `
    <div class="bar"><button class="btn" id="back">← Album</button></div>
    <article class="postcard pop">
      <div class="airmail" style="border-radius:0"></div>
      <div class="pc">
        <div class="left">
          <h2>${msg}</h2>
          <div class="big">${game.right}<small> / ${n} right</small></div>
          ${starHTML(stars, "big-stars")}
          <p class="sub">${tip}${newBest && prev ? " New personal best!" : ""}</p>
        </div>
        <div class="right">
          <div class="addr"><span>To:</span>My teacher</div>
          <div class="addr"><span>From:</span>${esc(save.name || "A Grade 7 student")}</div>
          <div class="addr"><span>Topic:</span>${esc(t.title)}</div>
          <div class="addr"><span>Score:</span>${game.score} pts · ${pct}%</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
            <button class="btn primary" id="again">Play again</button>
            <button class="btn" id="album">Back to album</button>
          </div>
        </div>
      </div>
    </article>
    ${game.misses.length ? `<div class="review"><p class="kicker" style="margin:8px 0 0;font-weight:700;color:var(--bad)">Letters to review (${game.misses.length})</p>
      ${game.misses.map(m => `<div class="item"><b>${esc(m.q)}</b>Answer: ${esc(m.a)} · ${esc(m.e)}</div>`).join("")}</div>` : ""}`;
  document.getElementById("back").addEventListener("click", home);
  document.getElementById("album").addEventListener("click", home);
  document.getElementById("again").addEventListener("click", () => start(game.id));
}

home();
</script>
</body>
</html>
