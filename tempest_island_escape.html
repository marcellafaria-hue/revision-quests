<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Prospero's Island 🌊</title>
<style>
  :root{
    --deep: #131a3a;
    --deep2: #1f2b63;
    --gold: #f2c94c;
    --gold-dark: #d4a72c;
    --teal: #3ec6c6;
    --coral: #ff6f61;
    --green: #4caf7d;
    --red: #e8555f;
    --card: #ffffff;
    --ink: #1c1e3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(circle at 20% 10%, #2a3b7a 0%, var(--deep) 45%, #0b0f24 100%);
    color: var(--ink);
    overflow-x:hidden;
  }
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .wrap{
    position:relative; z-index:1;
    max-width:720px; margin:0 auto; padding:24px 16px 60px;
  }
  header.top{
    text-align:center; color:var(--gold); margin-bottom:14px;
  }
  header.top h1{
    font-size:1.5rem; margin:6px 0 2px; letter-spacing:0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  header.top p{ color:#cfd6ff; margin:0; font-size:0.95rem; }

  .progress{
    display:flex; justify-content:center; gap:10px; margin: 18px 0 22px;
  }
  .progress .dot{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#26306b; color:#8b93c9; font-weight:bold; font-size:0.85rem;
    border:2px solid #3a4590; transition: all .3s ease;
  }
  .progress .dot.active{ background:var(--gold); color:var(--deep); border-color:var(--gold); transform:scale(1.15); }
  .progress .dot.done{ background:var(--green); color:white; border-color:var(--green); }

  .card{
    background: var(--card);
    border-radius:18px;
    padding:22px 22px 26px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    animation: floatIn .5s ease;
  }
  @keyframes floatIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .card h2{
    margin-top:0; font-size:1.3rem; color:var(--deep2);
    border-bottom: 3px dashed var(--gold-dark);
    padding-bottom:10px;
  }
  .flavor{
    background:#eef1ff; border-left:4px solid var(--teal);
    padding:10px 14px; border-radius:8px; font-style:italic; color:#333;
    margin-bottom:18px; font-size:0.97rem;
  }

  .question{ margin-bottom: 22px; }
  .question p.prompt{ font-weight:bold; margin:0 0 10px; line-height:1.4; }
  .options{ display:flex; flex-direction:column; gap:8px; }
  .opt-btn{
    text-align:left;
    padding:10px 14px; border-radius:10px; border:2px solid #d8dcf5;
    background:#f7f8ff; cursor:pointer; font-family:inherit; font-size:0.97rem;
    color:var(--ink); transition: all .15s ease;
  }
  .opt-btn:hover:not(:disabled){ border-color: var(--teal); background:#eafcfc; }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.correct{ background:#e2f7ea; border-color:var(--green); color:#1c5c3a; font-weight:bold; }
  .opt-btn.wrong{ background:#fdeaea; border-color:var(--red); color:#8a1f27; }
  .opt-btn.reveal{ background:#e2f7ea; border-color:var(--green); color:#1c5c3a; font-weight:bold; }

  .feedback{ margin-top:6px; font-size:0.9rem; min-height:1.2em; }
  .feedback.good{ color:#1c5c3a; }
  .feedback.bad{ color:#8a1f27; }

  .next-btn, .start-btn, .restart-btn{
    display:block; margin:18px auto 0; padding:12px 28px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    border:none; border-radius:30px; font-size:1.05rem; font-weight:bold;
    color:var(--deep); cursor:pointer; box-shadow: 0 8px 18px rgba(212,167,44,0.4);
    font-family:inherit;
  }
  .next-btn:hover, .start-btn:hover, .restart-btn:hover{ transform: translateY(-2px); }
  .hidden{ display:none !important; }

  .score-pill{
    position:sticky; top:8px; float:right; background:var(--deep2); color:var(--gold);
    padding:6px 14px; border-radius:20px; font-weight:bold; font-size:0.9rem;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
  }

  .final h2{ text-align:center; }
  .treasure{ font-size:4rem; text-align:center; margin:10px 0; }
  .final p{ text-align:center; font-size:1.05rem; }
  .stat-line{ text-align:center; font-size:1.4rem; font-weight:bold; color:var(--deep2); margin: 10px 0 4px;}

  canvas#confetti{ position:fixed; inset:0; pointer-events:none; z-index:5; }

  footer.note{
    text-align:center; color:#8b93c9; font-size:0.8rem; margin-top:26px;
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="wrap">
  <header class="top">
    <div style="font-size:2.2rem;">⛈️🏝️</div>
    <h1>Escape Prospero's Island</h1>
    <p>A weekend revision quest through <em>The Tempest</em></p>
  </header>

  <div class="progress" id="progress"></div>

  <div id="stage"></div>

  <footer class="note">Made for our 7th grade revision — have fun, and see you Monday! 🌊</footer>
</div>

<script>
/* ---------------- DATA ---------------- */
const stations = [
  {
    title: "Island 1 · Meet the Castaways",
    subtitle: "The Story of The Tempest",
    flavor: "Your ship has just wrecked on a strange, magical island. Before you explore, you'd better know who lives here...",
    icon: "🌪️",
    questions: [
      {
        prompt: "Prospero was once the Duke of Milan. Who betrayed him and stole his title?",
        options: ["Caliban", "His brother Antonio", "Ferdinand", "King Alonso"],
        correct: 1,
        good: "Right! Sneaky Antonio stole the dukedom and left Prospero and baby Miranda adrift at sea.",
        bad: "Not quite — it was Prospero's own brother, Antonio, who betrayed him."
      },
      {
        prompt: "Who is the airy spirit that serves Prospero and stirs up the storm?",
        options: ["Miranda", "Sycorax", "Ariel", "Trinculo"],
        correct: 2,
        good: "Correct! Ariel is the magical spirit who obeys Prospero — and longs to be free.",
        bad: "It's Ariel, the spirit of the air, who creates the storm with Prospero's magic."
      },
      {
        prompt: "Who lived on the island before Prospero arrived, and is now his unwilling servant?",
        options: ["Caliban", "Gonzalo", "Stephano", "Ferdinand"],
        correct: 0,
        good: "Yes — Caliban, son of the witch Sycorax, believes the island is rightfully his.",
        bad: "That's Caliban — he thinks Prospero stole the island from him."
      },
      {
        prompt: "Who does Miranda fall in love with after the shipwreck?",
        options: ["Antonio", "Ferdinand", "Alonso", "Trinculo"],
        correct: 1,
        good: "Aww, correct! Miranda and Ferdinand fall in love almost instantly.",
        bad: "It's Ferdinand, the King of Naples' son."
      }
    ]
  },
  {
    title: "Island 2 · Prospero's Spellbook",
    subtitle: "Modal Verbs",
    flavor: "Prospero's magic only works with the right words of power. Choose the modal verb that casts each spell correctly.",
    icon: "📖",
    questions: [
      {
        prompt: '"You ____ obey me, Ariel!" commands Prospero.',
        options: ["must", "might", "could have", "would"],
        correct: 0,
        good: "Yes! 'Must' shows a strong obligation — Ariel has no choice.",
        bad: "'Must' is correct here — it shows a strong command/obligation."
      },
      {
        prompt: "Ariel ____ fly faster than any bird on the island.",
        options: ["must", "can", "should", "would"],
        correct: 1,
        good: "Correct! 'Can' expresses Ariel's magical ability.",
        bad: "'Can' is the modal for ability — Ariel is able to fly incredibly fast."
      },
      {
        prompt: "Caliban believes he ____ be the true ruler of the island.",
        options: ["can", "must", "should", "might"],
        correct: 2,
        good: "Right! 'Should' expresses what Caliban believes is fair or deserved.",
        bad: "'Should' fits best — it shows Caliban's opinion about what's right."
      },
      {
        prompt: "Miranda ____ have felt afraid — after all, she'd never seen a storm like it.",
        options: ["might", "must not", "shouldn't", "can't"],
        correct: 0,
        good: "Correct! 'Might have' shows a possibility about the past.",
        bad: "'Might have felt' expresses a possibility — we're not 100% sure, just guessing."
      }
    ]
  },
  {
    title: "Island 3 · Ariel's Time Charm",
    subtitle: "Present Perfect Simple & Continuous",
    flavor: "Ariel's magic clock lets you peek at actions connecting the past to now. Pick the correct present perfect form.",
    icon: "⏳",
    questions: [
      {
        prompt: "The storm ____ since sunset, and the sailors are exhausted.",
        options: ["has raged", "has been raging", "raged", "rages"],
        correct: 1,
        good: "Yes! Present perfect continuous shows an action still going on, emphasizing duration.",
        bad: "'Has been raging' is best — the storm started earlier and is still happening now."
      },
      {
        prompt: "Before today, Miranda ____ another human besides her father.",
        options: ["has never seen", "has never been seeing", "never saw", "was never seeing"],
        correct: 0,
        good: "Correct! Present perfect simple + 'never' shows a completed life experience up to now.",
        bad: "'Has never seen' is right — it's a completed experience connected to now, not an ongoing action."
      },
      {
        prompt: "Caliban ____ about his chores all morning.",
        options: ["has complained", "has been complaining", "complained", "complains"],
        correct: 1,
        good: "Right! The repeated, ongoing grumbling calls for present perfect continuous.",
        bad: "'Has been complaining' fits — it emphasizes the repeated action over the whole morning."
      },
      {
        prompt: "Ferdinand ____ in love with Miranda the moment he saw her.",
        options: ["has fallen", "has been falling", "was falling", "falls"],
        correct: 0,
        good: "Correct! This is a single completed action with a present result — present perfect simple.",
        bad: "'Has fallen' is right — it's one completed action, not something ongoing."
      }
    ]
  },
  {
    title: "Island 4 · Caliban's Riddle Cave",
    subtitle: "Figurative Language",
    flavor: "Caliban loves riddles made of vivid language. Name the figurative device hiding in each line.",
    icon: "🔮",
    questions: [
      {
        prompt: '"The wind howled like a hungry wolf across the waves." — What device is this?',
        options: ["Simile", "Metaphor", "Personification", "Hyperbole"],
        correct: 0,
        good: "Yes! It compares the wind to a wolf using 'like' — that's a simile.",
        bad: "It's a simile — it uses 'like' to compare the wind to a wolf."
      },
      {
        prompt: '"We are such stuff as dreams are made on." — Prospero',
        options: ["Simile", "Metaphor", "Alliteration", "Onomatopoeia"],
        correct: 1,
        good: "Correct! Prospero directly says people ARE 'dream stuff' — a metaphor.",
        bad: "It's a metaphor — it says people ARE dream-stuff, without using 'like' or 'as'."
      },
      {
        prompt: '"The thunder grumbled and growled through the stormy sky."',
        options: ["Simile", "Hyperbole", "Personification", "Compound noun"],
        correct: 2,
        good: "Right! Giving the thunder human actions (grumbling, growling) is personification.",
        bad: "It's personification — the thunder is given human behavior."
      },
      {
        prompt: '"Sizzling, spitting, the storm\'s silver spears struck the sea."',
        options: ["Alliteration", "Metaphor", "Simile", "Hyperbole"],
        correct: 0,
        good: "Yes! All those repeated 's' sounds make this alliteration.",
        bad: "It's alliteration — notice all the repeated 's' sounds."
      },
      {
        prompt: '"Caliban carried a thousand buckets of water before lunch!"',
        options: ["Personification", "Simile", "Hyperbole", "Alliteration"],
        correct: 2,
        good: "Correct! 'A thousand buckets' is a huge exaggeration — hyperbole.",
        bad: "It's hyperbole — a wild exaggeration for effect."
      }
    ]
  },
  {
    title: "Island 5 · Miranda's Treasure Map",
    subtitle: "Compound Nouns",
    flavor: "The map is written in compound nouns! Combine your island vocabulary to fill each blank.",
    icon: "🗺️",
    questions: [
      {
        prompt: "The sailors survived the terrible ____.",
        options: ["shipwreck", "seashore", "moonlight", "sunrise"],
        correct: 0,
        good: "Yes! ship + wreck = shipwreck.",
        bad: "It's 'shipwreck' — ship + wreck."
      },
      {
        prompt: "Ariel's magic glowed like silver ____ over the water.",
        options: ["shipwreck", "moonlight", "thunderstorm", "seashore"],
        correct: 1,
        good: "Correct! moon + light = moonlight.",
        bad: "It's 'moonlight' — moon + light."
      },
      {
        prompt: "A sudden ____ shook the ship before it crashed.",
        options: ["sunrise", "seashore", "thunderstorm", "moonlight"],
        correct: 2,
        good: "Right! thunder + storm = thunderstorm.",
        bad: "It's 'thunderstorm' — thunder + storm."
      },
      {
        prompt: "Miranda loved walking along the sandy ____.",
        options: ["seashore", "shipwreck", "sunrise", "thunderstorm"],
        correct: 0,
        good: "Yes! sea + shore = seashore.",
        bad: "It's 'seashore' — sea + shore."
      },
      {
        prompt: "They watched the ____ paint the sky pink and gold.",
        options: ["moonlight", "thunderstorm", "sunrise", "seashore"],
        correct: 2,
        good: "Correct! sun + rise = sunrise.",
        bad: "It's 'sunrise' — sun + rise."
      }
    ]
  }
];

/* ---------------- STATE ---------------- */
let current = 0;
let totalStars = 0;
let totalQuestions = stations.reduce((s, st) => s + st.questions.length, 0);

const stage = document.getElementById('stage');
const progressEl = document.getElementById('progress');

function renderProgress(){
  progressEl.innerHTML = '';
  stations.forEach((st, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : (i < current ? ' done' : ''));
    d.textContent = i < current ? '✓' : st.icon;
    progressEl.appendChild(d);
  });
}

function renderIntro(){
  stage.innerHTML = `
    <div class="card">
      <h2>⚓ A Storm, A Wreck, A Chance to Revise</h2>
      <p>Your ship has just crashed on Prospero's enchanted island! To escape by Monday, you must cross <strong>5 islands</strong>, each guarding a piece of magic: the story of <em>The Tempest</em>, modal verbs, present perfect tenses, figurative language, and compound nouns.</p>
      <p>Answer each riddle to earn a star ⭐. Ready?</p>
      <button class="start-btn" onclick="startQuest()">Begin the Voyage ⛵</button>
    </div>
  `;
}

function startQuest(){
  current = 0;
  totalStars = 0;
  renderProgress();
  renderStation();
}

function renderStation(){
  renderProgress();
  const st = stations[current];
  let qHtml = '';
  st.questions.forEach((q, qi) => {
    const opts = q.options.map((opt, oi) =>
      `<button class="opt-btn" onclick="answer(${qi}, ${oi}, this)">${opt}</button>`
    ).join('');
    qHtml += `
      <div class="question" id="q-${qi}">
        <p class="prompt">${qi + 1}. ${q.prompt}</p>
        <div class="options">${opts}</div>
        <div class="feedback" id="fb-${qi}"></div>
      </div>
    `;
  });

  stage.innerHTML = `
    <div class="card">
      <span class="score-pill">⭐ ${totalStars}/${totalQuestions}</span>
      <h2>${st.icon} ${st.title}</h2>
      <p style="margin-top:-8px;color:#666;font-weight:bold;">${st.subtitle}</p>
      <div class="flavor">${st.flavor}</div>
      ${qHtml}
      <button class="next-btn hidden" id="next-btn" onclick="nextStation()">
        ${current === stations.length - 1 ? "Reach the Treasure! 🏆" : "Sail to the Next Island →"}
      </button>
    </div>
  `;
  window.__answered = new Array(st.questions.length).fill(false);
}

function answer(qi, oi, btnEl){
  const st = stations[current];
  const q = st.questions[qi];
  if (window.__answered[qi]) return;
  window.__answered[qi] = true;

  const container = document.getElementById('q-' + qi);
  const buttons = container.querySelectorAll('.opt-btn');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('reveal');
  });

  const fb = document.getElementById('fb-' + qi);
  if (oi === q.correct) {
    totalStars++;
    fb.textContent = '⭐ ' + q.good;
    fb.className = 'feedback good';
  } else {
    btnEl.classList.add('wrong');
    fb.textContent = '💭 ' + q.bad;
    fb.className = 'feedback bad';
  }

  document.querySelector('.score-pill').textContent = `⭐ ${totalStars}/${totalQuestions}`;

  if (window.__answered.every(a => a)) {
    document.getElementById('next-btn').classList.remove('hidden');
  }
}

function nextStation(){
  current++;
  if (current >= stations.length) {
    renderFinal();
  } else {
    renderStation();
  }
}

function renderFinal(){
  progressEl.querySelectorAll('.dot').forEach(d => d.classList.add('done'));
  let msg, tier;
  const pct = totalStars / totalQuestions;
  if (pct === 1) { tier = "Perfect voyage! You out-magic Prospero himself! 🧙"; }
  else if (pct >= 0.8) { tier = "Fantastic work, first mate! Just a few spells to polish. ⛵"; }
  else if (pct >= 0.6) { tier = "Good escape! Review the tricky islands before Monday. 🗺️"; }
  else { tier = "You made it off the island — now go back and study the map again! 📖"; }

  stage.innerHTML = `
    <div class="card final">
      <h2>🏆 You Escaped the Island!</h2>
      <div class="treasure">💎⚱️💎</div>
      <div class="stat-line">⭐ ${totalStars} / ${totalQuestions} stars earned</div>
      <p>${tier}</p>
      <p>Great job revising <em>The Tempest</em>, modal verbs, present perfect tenses, figurative language, and compound nouns this weekend!</p>
      <button class="restart-btn" onclick="startQuest()">Sail Again 🔁</button>
    </div>
  `;
  launchConfetti();
}

/* ---------------- Background stars ---------------- */
(function drawStars(){
  const c = document.createElement('div');
  c.className = 'stars';
  document.body.prepend(c);
})();

/* ---------------- Confetti (vanilla canvas) ---------------- */
function launchConfetti(){
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#f2c94c', '#3ec6c6', '#ff6f61', '#4caf7d', '#ffffff'];
  const pieces = Array.from({length: 140}, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height,
    r: 4 + Math.random() * 5,
    c: colors[Math.floor(Math.random() * colors.length)],
    vy: 2 + Math.random() * 3,
    vx: -1.5 + Math.random() * 3,
    rot: Math.random() * 360,
    vr: -6 + Math.random() * 12
  }));
  let frames = 0;
  function tick(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 0.6);
      ctx.restore();
    });
    frames++;
    if (frames < 260) {
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  tick();
}
window.addEventListener('resize', () => {
  const canvas = document.getElementById('confetti');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

/* ---------------- Init ---------------- */
renderProgress();
renderIntro();
</script>
</body>
</html>
