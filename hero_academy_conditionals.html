<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Academy: The If-Power Trials ⚡</title>
<style>
  :root{
    --deep: #1a1033;
    --deep2: #2d1b69;
    --gold: #ffd23f;
    --gold-dark: #f4a300;
    --teal: #00d9ff;
    --coral: #ff4d6d;
    --green: #4caf7d;
    --red: #e8555f;
    --card: #fffbf0;
    --ink: #201333;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(circle at 20% 10%, #3d2472 0%, var(--deep) 45%, #0a0618 100%);
    color: var(--ink);
    overflow-x:hidden;
  }
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .wrap{
    position:relative; z-index:1;
    max-width:720px; margin:0 auto; padding:24px 16px 60px;
  }
  header.top{
    text-align:center; color:var(--gold); margin-bottom:14px;
  }
  header.top h1{
    font-size:1.5rem; margin:6px 0 2px; letter-spacing:0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  header.top p{ color:#d8ccff; margin:0; font-size:0.95rem; }

  .progress{
    display:flex; justify-content:center; gap:10px; margin: 18px 0 22px;
    flex-wrap: wrap;
  }
  .progress .dot{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#291a4d; color:#9b8fc9; font-weight:bold; font-size:0.85rem;
    border:2px solid #4a3580; transition: all .3s ease;
  }
  .progress .dot.active{ background:var(--gold); color:var(--deep); border-color:var(--gold); transform:scale(1.15); }
  .progress .dot.done{ background:var(--green); color:white; border-color:var(--green); }

  .card{
    background: var(--card);
    border-radius:18px;
    padding:22px 22px 26px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    animation: floatIn .5s ease;
  }
  @keyframes floatIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .card h2{
    margin-top:0; font-size:1.3rem; color:var(--deep2);
    border-bottom: 3px dashed var(--gold-dark);
    padding-bottom:10px;
  }
  .flavor{
    background:#f0eaff; border-left:4px solid var(--teal);
    padding:10px 14px; border-radius:8px; font-style:italic; color:#333;
    margin-bottom:18px; font-size:0.97rem;
  }

  .question{ margin-bottom: 22px; }
  .question p.prompt{ font-weight:bold; margin:0 0 10px; line-height:1.4; }
  .options{ display:flex; flex-direction:column; gap:8px; }
  .opt-btn{
    text-align:left;
    padding:10px 14px; border-radius:10px; border:2px solid #ddd3f5;
    background:#f8f6ff; cursor:pointer; font-family:inherit; font-size:0.97rem;
    color:var(--ink); transition: all .15s ease;
  }
  .opt-btn:hover:not(:disabled){ border-color: var(--teal); background:#e8fcff; }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.wrong{ background:#fdeaea; border-color:var(--red); color:#8a1f27; }
  .opt-btn.reveal{ background:#e2f7ea; border-color:var(--green); color:#1c5c3a; font-weight:bold; }

  .feedback{ margin-top:6px; font-size:0.9rem; min-height:1.2em; }
  .feedback.good{ color:#1c5c3a; }
  .feedback.bad{ color:#8a1f27; }

  .next-btn, .start-btn, .restart-btn{
    display:block; margin:18px auto 0; padding:12px 28px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    border:none; border-radius:30px; font-size:1.05rem; font-weight:bold;
    color:var(--deep); cursor:pointer; box-shadow: 0 8px 18px rgba(244,163,0,0.4);
    font-family:inherit;
  }
  .next-btn:hover, .start-btn:hover, .restart-btn:hover{ transform: translateY(-2px); }
  .hidden{ display:none !important; }

  .score-pill{
    position:sticky; top:8px; float:right; background:var(--deep2); color:var(--gold);
    padding:6px 14px; border-radius:20px; font-weight:bold; font-size:0.9rem;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
  }

  .final h2{ text-align:center; }
  .treasure{ font-size:4rem; text-align:center; margin:10px 0; }
  .final p{ text-align:center; font-size:1.05rem; }
  .stat-line{ text-align:center; font-size:1.4rem; font-weight:bold; color:var(--deep2); margin: 10px 0 4px;}

  canvas#confetti{ position:fixed; inset:0; pointer-events:none; z-index:5; }

  footer.note{
    text-align:center; color:#9b8fc9; font-size:0.8rem; margin-top:26px;
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="wrap">
  <header class="top">
    <div style="font-size:2.2rem;">🦸⚡</div>
    <h1>Hero Academy: The If-Power Trials</h1>
    <p>A weekend revision quest through First & Second Conditionals</p>
  </header>

  <div class="progress" id="progress"></div>

  <div id="stage"></div>

  <footer class="note">Made for our 7th grade revision — go unlock those powers, and see you Monday! ⚡</footer>
</div>

<script>
/* ---------------- DATA ---------------- */
const stations = [
  {
    title: "Trial 1 · Real or Imaginary?",
    subtitle: "Spotting First vs Second Conditional",
    flavor: "Welcome, recruit! Every hero must first learn to tell the difference between what's REALLY possible and what's just a daydream. Read carefully...",
    icon: "🎓",
    questions: [
      {
        prompt: '"If it rains tomorrow, I will bring an umbrella." Which conditional is this?',
        options: ["First conditional", "Second conditional", "Zero conditional", "Third conditional"],
        correct: 0,
        good: "Yes! A real, possible future situation — that's the first conditional.",
        bad: "It's the first conditional — a realistic future possibility."
      },
      {
        prompt: '"If I had a million dollars, I would travel the world." Which conditional is this?',
        options: ["First conditional", "Second conditional", "Zero conditional", "Third conditional"],
        correct: 1,
        good: "Correct! An imaginary, unlikely situation — that's the second conditional.",
        bad: "It's the second conditional — an imaginary, hypothetical situation."
      },
      {
        prompt: "Which structure is correct for the FIRST conditional?",
        options: ["If + present simple, will + base verb", "If + past simple, would + base verb", "If + present perfect, would + base verb", "If + will, present simple"],
        correct: 0,
        good: "Right! If + present simple, ... will + base verb.",
        bad: "The first conditional is: If + present simple, ... will + base verb."
      },
      {
        prompt: "Which structure is correct for the SECOND conditional?",
        options: ["If + present simple, will + base verb", "If + past simple, would + base verb", "If + past perfect, would have + past participle", "If + present continuous, will be"],
        correct: 1,
        good: "Correct! If + past simple, ... would + base verb.",
        bad: "The second conditional is: If + past simple, ... would + base verb."
      }
    ]
  },
  {
    title: "Trial 2 · First Conditional Missions",
    subtitle: "Real, Possible Futures",
    flavor: "Your trainer only promises real rewards for real effort. Complete each mission with the correct first conditional form.",
    icon: "🚀",
    questions: [
      {
        prompt: "If you ____ hard every day, you will unlock your first power.",
        options: ["train", "trained", "will train", "would train"],
        correct: 0,
        good: "Yes! After 'if' in the first conditional, we use the present simple.",
        bad: "It's 'train' — present simple after 'if' in the first conditional."
      },
      {
        prompt: "If you don't focus, you ____ your powers.",
        options: ["will lose", "lost", "would lose", "lose"],
        correct: 0,
        good: "Correct! 'Will lose' — a real consequence in the future.",
        bad: "It's 'will lose' — the result clause uses 'will' + base verb."
      },
      {
        prompt: "The trainer will test you if you ____ ready.",
        options: ["are", "were", "will be", "would be"],
        correct: 0,
        good: "Right! Present simple 'are' after 'if', even though the main clause comes first.",
        bad: "It's 'are' — present simple after 'if', no matter the sentence order."
      },
      {
        prompt: "If she practises flying, she ____ faster.",
        options: ["will improve", "improved", "would improve", "improve"],
        correct: 0,
        good: "Correct! 'Will improve' shows a realistic future result.",
        bad: "It's 'will improve' — the result clause uses 'will' + base verb."
      }
    ]
  },
  {
    title: "Trial 3 · Second Conditional Dreams",
    subtitle: "Imaginary & Hypothetical Powers",
    flavor: "Now close your eyes and dream big — these powers aren't real (yet). Use the second conditional to imagine them.",
    icon: "✨",
    questions: [
      {
        prompt: "If I ____ invisible, I would sneak into the villain's lair.",
        options: ["were", "am", "will be", "have been"],
        correct: 0,
        good: "Yes! With 'if I', heroes love to say 'were' instead of 'was' in the second conditional.",
        bad: "It's 'were' — in the second conditional, 'if I/he/she were' is the classic hero form."
      },
      {
        prompt: "If you had super strength, what ____ you do?",
        options: ["would", "will", "do", "did"],
        correct: 0,
        good: "Correct! 'Would' pairs with the imaginary 'if you had...'",
        bad: "It's 'would' — the second conditional question form."
      },
      {
        prompt: "She would fly around the world if she ____ wings.",
        options: ["had", "has", "will have", "have"],
        correct: 0,
        good: "Right! Past simple 'had' after 'if' in the second conditional.",
        bad: "It's 'had' — past simple after 'if', even though it's about the present/future."
      },
      {
        prompt: "If we ____ read minds, we would know all the villain's plans.",
        options: ["could", "can", "will can", "would can"],
        correct: 0,
        good: "Correct! 'Could' is the past form of 'can', used for hypothetical ability.",
        bad: "It's 'could' — the past modal form used in second conditional sentences."
      }
    ]
  },
  {
    title: "Trial 4 · Mixed Powers",
    subtitle: "Choosing the Right Conditional",
    flavor: "A true hero knows exactly when a situation is realistic and when it's pure fantasy. Choose wisely!",
    icon: "🔀",
    questions: [
      {
        prompt: "Realistic mission: If it ____ later, we will cancel outdoor training.",
        options: ["rains", "rained", "would rain", "will rain"],
        correct: 0,
        good: "Yes! A real possibility — present simple after 'if'.",
        bad: "It's 'rains' — present simple, since this is a realistic possibility."
      },
      {
        prompt: "Pure fantasy: If dragons ____ real, superheroes would need bigger capes.",
        options: ["were", "are", "will be", "have been"],
        correct: 0,
        good: "Correct! An imaginary situation calls for 'were' + would.",
        bad: "It's 'were' — this is an imaginary situation, so we use the second conditional."
      },
      {
        prompt: "Real possibility: If you finish your homework, you ____ join tonight's mission.",
        options: ["can", "could", "would", "will can"],
        correct: 0,
        good: "Right! 'Can' works like 'will be able to' in the first conditional.",
        bad: "It's 'can' — a realistic future possibility, first conditional style."
      },
      {
        prompt: "Hypothetical: If I ____ a superhero, I would fight crime every night.",
        options: ["were", "am", "will be", "had been"],
        correct: 0,
        good: "Correct! Imaginary situation — 'if I were' + would.",
        bad: "It's 'were' — this is a daydream, so second conditional applies."
      }
    ]
  },
  {
    title: "Trial 5 · Boss Battle",
    subtitle: "Spot & Fix the Mistakes",
    flavor: "The final test! Even the best heroes mix up their conditionals sometimes. Can you catch the mistakes?",
    icon: "🏆",
    questions: [
      {
        prompt: "Find the mistake: \"If I will have super speed, I would run around the world.\"",
        options: ["Should be: If I had super speed, I would run...", "Should be: If I have super speed, I will run...", "Should be: If I would have super speed, I will run...", "No mistake"],
        correct: 0,
        good: "Yes! Never use 'will' in the if-clause — it should be 'If I had..., I would run...'",
        bad: "The if-clause should never use 'will' — the fix is 'If I had..., I would run...'"
      },
      {
        prompt: "Find the mistake: \"If you study the spellbook, you would pass the trial.\"",
        options: ["Should be: If you study..., you will pass...", "Should be: If you studying..., you would pass...", "Should be: If you will study..., you would pass...", "No mistake"],
        correct: 0,
        good: "Correct! The if-clause uses present simple, so the result clause needs 'will', not 'would'.",
        bad: "It's a mismatched conditional — since 'study' is present simple, the result needs 'will pass'."
      },
      {
        prompt: "Choose the best response to: \"What would you do if you found a genie?\"",
        options: ["I would wish for flying superpowers.", "I will wish for flying superpowers.", "I wish for flying superpowers.", "I would have wished for flying superpowers."],
        correct: 0,
        good: "Yes! 'Would' answers a second conditional question about an imaginary situation.",
        bad: "It's 'I would wish...' — matching the imaginary second conditional question."
      },
      {
        prompt: "Real or Imaginary? \"If the villain attacks tonight, the team will be ready.\"",
        options: ["Real / First conditional", "Imaginary / Second conditional", "Neither", "Both"],
        correct: 0,
        good: "Correct! A realistic possibility tonight — first conditional.",
        bad: "It's real / first conditional — a genuine possibility, not a daydream."
      }
    ]
  }
];

/* ---------------- STATE ---------------- */
let current = 0;
let totalStars = 0;
let totalQuestions = stations.reduce((s, st) => s + st.questions.length, 0);

const stage = document.getElementById('stage');
const progressEl = document.getElementById('progress');

function renderProgress(){
  progressEl.innerHTML = '';
  stations.forEach((st, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : (i < current ? ' done' : ''));
    d.textContent = i < current ? '✓' : st.icon;
    progressEl.appendChild(d);
  });
}

function renderIntro(){
  stage.innerHTML = `
    <div class="card">
      <h2>⚡ Welcome to Hero Academy</h2>
      <p>You've just been accepted into Hero Academy! Before your powers awaken for good, you must pass <strong>5 trials</strong> that test the two most important spells of hero-speak: the <em>first conditional</em> (real, possible futures) and the <em>second conditional</em> (imaginary, hypothetical dreams).</p>
      <p>Answer each challenge to earn a star ⭐. Ready to unlock your powers?</p>
      <button class="start-btn" onclick="startQuest()">Begin the Trials ⚡</button>
    </div>
  `;
}

function startQuest(){
  current = 0;
  totalStars = 0;
  renderProgress();
  renderStation();
}

function renderStation(){
  renderProgress();
  const st = stations[current];
  let qHtml = '';
  st.questions.forEach((q, qi) => {
    const opts = q.options.map((opt, oi) =>
      `<button class="opt-btn" onclick="answer(${qi}, ${oi}, this)">${opt}</button>`
    ).join('');
    qHtml += `
      <div class="question" id="q-${qi}">
        <p class="prompt">${qi + 1}. ${q.prompt}</p>
        <div class="options">${opts}</div>
        <div class="feedback" id="fb-${qi}"></div>
      </div>
    `;
  });

  stage.innerHTML = `
    <div class="card">
      <span class="score-pill">⭐ ${totalStars}/${totalQuestions}</span>
      <h2>${st.icon} ${st.title}</h2>
      <p style="margin-top:-8px;color:#666;font-weight:bold;">${st.subtitle}</p>
      <div class="flavor">${st.flavor}</div>
      ${qHtml}
      <button class="next-btn hidden" id="next-btn" onclick="nextStation()">
        ${current === stations.length - 1 ? "Unlock Your Powers! 🏆" : "Advance to the Next Trial →"}
      </button>
    </div>
  `;
  window.__answered = new Array(st.questions.length).fill(false);
}

function answer(qi, oi, btnEl){
  const st = stations[current];
  const q = st.questions[qi];
  if (window.__answered[qi]) return;
  window.__answered[qi] = true;

  const container = document.getElementById('q-' + qi);
  const buttons = container.querySelectorAll('.opt-btn');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('reveal');
  });

  const fb = document.getElementById('fb-' + qi);
  if (oi === q.correct) {
    totalStars++;
    fb.textContent = '⭐ ' + q.good;
    fb.className = 'feedback good';
  } else {
    btnEl.classList.add('wrong');
    fb.textContent = '💭 ' + q.bad;
    fb.className = 'feedback bad';
  }

  document.querySelector('.score-pill').textContent = `⭐ ${totalStars}/${totalQuestions}`;

  if (window.__answered.every(a => a)) {
    document.getElementById('next-btn').classList.remove('hidden');
  }
}

function nextStation(){
  current++;
  if (current >= stations.length) {
    renderFinal();
  } else {
    renderStation();
  }
}

function renderFinal(){
  progressEl.querySelectorAll('.dot').forEach(d => d.classList.add('done'));
  let tier;
  const pct = totalStars / totalQuestions;
  if (pct === 1) { tier = "Perfect trials! Your powers are fully unlocked — true Hero Academy legend! 🦸"; }
  else if (pct >= 0.8) { tier = "Fantastic work, hero-in-training! Just a couple of spells to polish. ⚡"; }
  else if (pct >= 0.6) { tier = "Good progress! Review the tricky trials before Monday. 🎓"; }
  else { tier = "You survived the trials — now go back and study the spellbook again! 📖"; }

  stage.innerHTML = `
    <div class="card final">
      <h2>🏆 Your Powers Are Unlocked!</h2>
      <div class="treasure">🦸⚡✨</div>
      <div class="stat-line">⭐ ${totalStars} / ${totalQuestions} stars earned</div>
      <p>${tier}</p>
      <p>Great job revising the first and second conditionals this weekend! Remember: real & possible = first conditional, imaginary & hypothetical = second conditional.</p>
      <button class="restart-btn" onclick="startQuest()">Retake the Trials 🔁</button>
    </div>
  `;
  launchConfetti();
}

/* ---------------- Background stars ---------------- */
(function drawStars(){
  const c = document.createElement('div');
  c.className = 'stars';
  document.body.prepend(c);
})();

/* ---------------- Confetti (vanilla canvas) ---------------- */
function launchConfetti(){
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#ffd23f', '#00d9ff', '#ff4d6d', '#4caf7d', '#ffffff'];
  const pieces = Array.from({length: 140}, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height,
    r: 4 + Math.random() * 5,
    c: colors[Math.floor(Math.random() * colors.length)],
    vy: 2 + Math.random() * 3,
    vx: -1.5 + Math.random() * 3,
    rot: Math.random() * 360,
    vr: -6 + Math.random() * 12
  }));
  let frames = 0;
  function tick(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 0.6);
      ctx.restore();
    });
    frames++;
    if (frames < 260) {
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  tick();
}
window.addEventListener('resize', () => {
  const canvas = document.getElementById('confetti');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

/* ---------------- Init ---------------- */
renderProgress();
renderIntro();
</script>
</body>
</html>
